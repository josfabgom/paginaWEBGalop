<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo GaLop S.R.L.</title>
    <link rel="icon" href="/assets/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body class="has-data">
<header class="catalog-top-nav">
    <a href="/" class="nav-back-btn">⬅ Volver al Inicio</a>
    <button id="nav-cart-btn" class="nav-cart-btn" type="button" aria-label="Ver cotización">
        🛒 Mi Cotización <span id="nav-cart-badge" class="cart-badge">0</span>
    </button>
</header>

<div class="container">
    <div class="header-logo"><div id="logo-place"><img src="/assets/images/logo.png"></div><h1 style="margin:10px 0 5px 0;font-size:26px;color:#0f172a;">CATÁLOGO DE PRODUCTOS</h1><p style="color:#64748b;margin:0;">Rollos, Tóner, Tecnología y Librería · GaLop S.R.L.</p></div>
    <div class="top-panel"><section id="seller-card" class="seller-card" aria-label="Datos del vendedor" style="display: none;"></section>
    <nav id="categories-panel" class="categories-panel" aria-label="Categorías de productos" style="display: none;"><h2>Explorá nuestros productos</h2><div id="category-buttons" class="category-buttons"></div></nav></div>
    <div id="catalog-date" class="catalog-date"></div>
    <input type="text" id="search" class="search-box" placeholder="Buscar productos por código, descripción o categoría...">
    <div id="catalog-sections"></div>
<div id="cart-overlay" class="cart-overlay" role="presentation">
  <section class="cart-dialog" role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1">
    <div class="cart-head"><h2 id="cart-title">🛒 Cotización de Productos</h2><button id="cart-close" class="cart-close" type="button" aria-label="Cerrar">×</button></div>
    <p style="color:#64748b;font-size:14px;margin:8px 0 16px;">Revisá los artículos seleccionados y envianos tu solicitud directa por WhatsApp para confirmar precios y stock.</p>
    <div id="cart-items"></div>
    <div id="cart-total" class="cart-total"></div>
    
    <div class="cart-customer-box">
      <div class="form-row">
        <label for="cart-client-name">Tu Nombre / Empresa (opcional):</label>
        <input type="text" id="cart-client-name" placeholder="Ej: Juan Pérez / Empresa S.A.">
      </div>
      <div class="form-row">
        <label for="cart-client-note">Observaciones o consulta (opcional):</label>
        <input type="text" id="cart-client-note" placeholder="Ej: Consultar por envío al interior / Factura A">
      </div>
    </div>

    <div class="cart-options-bar">
      <button id="cart-clear" class="cart-clear" type="button">🗑️ Vaciar cotización</button>
      <button id="cart-copy" class="cart-copy-btn" type="button">📋 Copiar texto</button>
    </div>
    <div class="cart-actions">
      <button id="cart-back" class="cart-back" type="button">Seguir viendo productos</button>
      <button id="cart-send" class="cart-send" type="button">💬 Solicitar Cotización por WhatsApp</button>
    </div>
  </section>
</div>
<div id="cart-toast" class="cart-toast" role="status" aria-live="polite"></div>

<div id="photo-overlay" class="photo-overlay" role="dialog" aria-modal="true" aria-label="Fotografía ampliada"><button id="photo-close" type="button" aria-label="Cerrar imagen">×</button><img id="photo-large" alt="Fotografía del producto"><p id="photo-caption"></p></div>
<script src="/app.v5.js"></script>


</body></html>
